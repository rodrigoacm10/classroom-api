repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (linter)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(src|tests)/
        pass_filenames: true

      - id: ruff-format
        name: ruff format (formatter)
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(src|tests)/
        pass_filenames: true

      - id: pyrefly-check
        name: pyrefly (type checker)
        entry: uv run pyrefly check src
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
